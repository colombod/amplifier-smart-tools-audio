name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_COLOR: "1"

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create the environment
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Prove this environment has no provider credentials
        # Asserted, never assumed. The tool claims its deterministic verbs run
        # with no provider configured. If a credential ever leaked into CI, those
        # checks would keep passing -- for the wrong reason -- and nothing would
        # say so. This step is what makes the green tick mean what it says.
        shell: bash
        run: |
          leaked=""
          for var in ANTHROPIC_API_KEY OPENAI_API_KEY GOOGLE_API_KEY \
                     GEMINI_API_KEY AZURE_OPENAI_API_KEY; do
            if [ -n "${!var:-}" ]; then leaked="$leaked $var"; fi
          done
          if [ -n "$leaked" ]; then
            echo "::error::provider credentials present in CI:$leaked"
            exit 1
          fi
          echo "no provider credentials present"

      - name: Tests
        run: uv run pytest -q

      - name: Licence enforcement (MIT-compatible dependency check)
        # Runs again, named, for visibility -- it is already exercised by the
        # `Tests` step above since it is an ordinary pytest module. See
        # tests/license_policy.py for the resolved-dependency-graph metadata
        # check, the denylist backstop and the src/ AST import scan; see
        # AGENTS.md section 1 for the licence rule this enforces.
        run: uv run pytest tests/test_license_enforcement.py -v

  speech-extra:
    name: Speech extra (openai-whisper, CPU torch)
    # A new job, not a step folded into `test`: this is the only place the
    # `speech` extra -- and its licence-policy consequences (issue #44) --
    # are exercised in CI at all. `test`'s plain `uv sync` installs no
    # optional extra, so without this job the entire torch/openai-whisper
    # path (including the CPU-index pin and the no-ffmpeg guarantee) would
    # be untested in CI, checked only by whoever happens to install it
    # locally. Measured cost on a GitHub-hosted runner's class of hardware:
    # ~187 MiB torch download (CPU wheel, confirmed no nvidia-* packages),
    # ~139 MiB whisper `base` model download (first transcribe call only,
    # not cached across runs -- see the note below), full suite ~2 minutes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create the environment with the speech extra, CPU-only torch
        # The exact command docs/CONFIGURATION.md and README.md document --
        # kept in sync with tests/test_docs_cpu_index_guard.py, which fails
        # if any documented install command (including this one's shape)
        # ever loses the --index/--index-strategy flags.
        run: uv sync --extra speech

      - name: Prove no nvidia-* package was pulled in
        # The entire reason for pinning torch's own index: without it, a
        # plain `uv sync --extra speech` on Linux resolves CUDA wheels
        # instead of the ~187 MiB CPU-only build. Asserted here, not just
        # hoped for.
        shell: bash
        run: |
          if uv pip list --python .venv/bin/python | grep -i '^nvidia-'; then
            echo "::error::an nvidia-* package was resolved -- the CPU-only torch index pin failed"
            exit 1
          fi
          echo "no nvidia-* package present"

      - name: Licence enforcement with the speech extra installed
        # The whole point of this job's existence for licence purposes:
        # with `speech` installed, torch/openai-whisper/tiktoken/certifi/
        # tqdm/etc. all appear in the resolved environment and must all
        # classify ALLOWED -- see tests/license_policy.py's
        # WEAK_COPYLEFT_ACKNOWLEDGEMENTS and _ALLOWED_SPDX_IDS additions.
        run: uv run pytest tests/test_license_enforcement.py -v

      - name: Speech-extra tests (real openai-whisper, no replay)
        # Deliberately scoped to the files that actually call the real
        # library -- not the full suite, to keep this job's purpose (prove
        # the real install works) distinct from `test`'s job (prove the
        # deterministic default tree works). The no-ffmpeg guard
        # (test_detect_fillers_never_spawns_ffmpeg) and the CLI-level
        # `detect fillers` tests both need the real model downloaded once.
        run: uv run pytest tests/test_dsp_detect.py tests/test_detect_cli.py tests/test_docs_cpu_index_guard.py -v

  conformance:
    name: Smart-tool conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out this tool
        uses: actions/checkout@v4
        with:
          path: tool

      - name: Check out the conformance kit
        # Fetched fresh rather than vendored: the bar is whatever the
        # specification says today, not whatever it said when someone last
        # copied it into this repository.
        uses: actions/checkout@v4
        with:
          repository: microsoft/amplifier-smart-tools
          path: kit

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install aud so cli_argv resolves
        # The kit launches the tool through smart-tool.json's cli_argv, which is
        # ["aud"] -- it must be findable on PATH. Conformance therefore grades an
        # installed tool, not a bare checkout.
        run: |
          uv tool install ./tool
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Conformance
        working-directory: kit
        run: uv run conformance/run.py ../tool

  install-from-git:
    name: Install from git
    # Why this job exists: every other job here runs against the checkout, and a
    # local or editable install masks a broken git reference forever -- the
    # packaging seam is the one thing a checkout cannot exercise. This is the
    # only job that would notice a tool that builds perfectly in place and
    # cannot be installed by anyone else.
    #
    # Restricted to push and manual dispatch: a pull_request run's github.sha is
    # a merge commit that is not fetchable by bare sha from the repository URL,
    # so running it there would fail for a reason that has nothing to do with the
    # change under review.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install this exact commit from git, with no checkout present
        run: |
          uv tool install "aud @ git+https://github.com/${{ github.repository }}@${{ github.sha }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run the deterministic smoke capabilities
        run: |
          aud manifest
          aud check
