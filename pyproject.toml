[project]
name = "aud"
version = "0.12.0"
description = "Master and clean up audio: analyse a file, find what is in it (onsets, silences, filler words), then run it through a mastering chain -- cut, strip silence, de-ess, de-verb, EQ, EQ-match to a reference, multiband compression, saturation, controlled reverb, loudness and true-peak limiting. Chainable: every verb appends to a mastering plan and one render applies the whole chain"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3.0",
    # 1.15 floor (was 1.14): scipy.signal.ShortTimeFFT.istft had two
    # correctness bugs fixed in 1.15, and aud.dsp.stft depends on istft's
    # exact-reconstruction behaviour -- see that module's docstring.
    "scipy>=1.15,<2.0",
    "soundfile>=0.13,<0.14",
    "pyloudnorm>=0.1.1,<0.2.0",
    "pydantic>=2.9,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
# Time-stretch and pitch-shift beyond the built-in phase vocoder. Signalsmith
# Stretch is MIT and ships wheels; Rubber Band is GPL and deliberately NOT a
# dependency of this tool. Installed as an extra rather than a follow-up step:
#
#   uv tool install 'aud[stretch] @ git+https://github.com/colombod/amplifier-smart-tools-audio'
stretch = [
    "python-stretch>=0.3,<1.0",
]

# Word-level speech timings, needed only by `aud detect fillers` to locate
# "umm"/"uh"/"ehm". Previously faster-whisper (MIT) -- REPLACED, see issue #44:
# faster-whisper hard-imports `av` (PyAV) at `faster_whisper/audio.py`, and
# PyAV's PyPI wheel bundles an FFmpeg build with `libx264`/`libx265`
# (GPL-2.0-or-later, genuinely dynamically linked) and a `libmp3lame` with the
# GPL-only `mpglib` decoder compiled in -- confirmed against av==19.0.0, not a
# stale-version fluke. `openai-whisper` is MIT (code AND model weights) and has
# no such dependency, at the cost of pulling in `torch`. To keep that
# unattended-installable and small, this project pins `torch` to PyPI's
# CPU-only wheel index (see `[[tool.uv.index]]`/`[tool.uv.sources]` below) for
# THIS project's own `uv sync`/`uv run` -- a default PyPI install of `torch`
# pulls ~8 GB (6.5 GB of it NVIDIA CUDA wheels) on a CPU-only box; the CPU
# wheel is ~187 MB and carries no GPL-family licence.
#
# IMPORTANT: `[tool.uv.sources]` applies ONLY to this project's own workflow
# (`uv sync`, `uv run`, a local `uv tool install ./tool`). It is NOT consulted
# when `aud` is installed as a dependency from elsewhere, e.g.
# `uv tool install 'aud[speech] @ git+https://...'` -- that command resolves
# against PyPI alone and will pull the default (possibly CUDA) torch build.
# The caller's install command must carry the index explicitly -- see
# docs/CONFIGURATION.md's speech section for the exact command.
#
#   uv tool install 'aud[speech] @ git+https://github.com/colombod/amplifier-smart-tools-audio' --index https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
#
# `torch` is listed here EXPLICITLY, even though `openai-whisper` already
# depends on it transitively -- measured directly (see the PR body): uv's
# `[tool.uv.sources]` package-pinning ONLY takes effect for a package that
# appears as a DIRECT dependency somewhere in the project; left purely
# transitive, uv resolves `torch` straight from PyPI (picking up the default,
# possibly-CUDA build) and never even queries the pinned index.
speech = [
    "openai-whisper>=20231117",
    "torch>=2.0",
]

[project.urls]
Repository = "https://github.com/colombod/amplifier-smart-tools-audio"

[project.scripts]
aud = "aud.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "aud"

[tool.uv]
add-bounds = "major"

# Route `torch` (pulled in transitively by the `speech` extra's
# `openai-whisper`) to PyPI's CPU-only wheel index for this project's own
# `uv sync`/`uv run`/local `uv tool install ./tool` -- see the `speech` extra's
# comment above for why, and for the caveat that this block does NOT apply
# when `aud` is installed as a dependency from git.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 120
target-version = "py311"
# tests/fixtures/recorded/scripts/*.py are recording/capture scripts kept
# byte-identical to what actually ran when the fixtures were captured (see
# tests/fixtures/recorded/RECORDING.md) -- they are evidence, not
# maintained source, and are never reformatted or "fixed".
extend-exclude = ["tests/fixtures/recorded/scripts", "site/theme", "_site"]

[tool.ruff.lint]
select = ["F", "E", "I", "N", "UP", "RUF", "B", "C4", "PIE", "PT", "PTH", "SIM", "TID"]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
